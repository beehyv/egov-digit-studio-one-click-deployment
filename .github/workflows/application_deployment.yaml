name: Deploy Applications to Cluster


on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment."
        required: true
        type: choice
        options:
          - env
        default: env

      create_infra:
        description: "Create/Update infracture before deploying."
        type: boolean
        required: true
        default: false


jobs:
  Infra_creation:
    if: ${{ inputs.create_infra }}
    uses: ./.github/workflows/infra_setup.yaml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  DIGIT-deployment:
    needs: Infra_creation
    if: ${{ !cancelled() && !failure() }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ vars.CLUSTER_NAME }}

      - name: Install sops
        run: |
          sudo apt update
          wget https://github.com/mozilla/sops/releases/download/v3.7.1/sops-v3.7.1.linux
          chmod +x sops-v3.7.1.linux
          sudo mv sops-v3.7.1.linux /usr/local/bin/sops

      # - name: Decrypt secrets
      #   working-directory: ./deploy-as-code/charts
      #   run: sops -d -i --kms ${{ secrets.PUBLIC_KMS_KEY }} ./environments/${{ inputs.environment }}-secrets.yaml

      - name: Install Helmfile
        uses: helmfile/helmfile-action@v2.2.0
        with:
          helm-version: 'v3.11.0'
          helmfile-version: "v0.150.0"
          helm-plugins: https://github.com/databus23/helm-diff@v3.1.3
          helmfile-args: --version

      - name: Digit deployment
        working-directory: deploy-as-code
        env:
          HELMFILE_ENV: ${{ inputs.environment }}
        run: helmfile -f digit-helmfile.yaml apply --include-needs=true
