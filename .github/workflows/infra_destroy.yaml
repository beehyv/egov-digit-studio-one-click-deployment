name: Delete Infrastructure Resources

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment."
        required: true
        type: choice
        options:
          - env
        default: env

jobs:
  infra-creation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        run: |
          curl -o terraform.zip https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
          unzip terraform.zip
          sudo mv terraform /usr/local/bin/
          terraform -version

      # === Destroy Infra === #
      - name: Terraform init - Infra deletion
        working-directory: infra-as-code/terraform/sample-aws
        run: terraform init -backend-config=./backends/${{ inputs.environment }}.hcl

      - name: Terraform Validate - Infra deletion
        working-directory: infra-as-code/terraform/sample-aws
        run: terraform validate -no-color

      - name: Terraform Apply - Infra deletion
        working-directory: infra-as-code/terraform/sample-aws
        run: |
          terraform destroy -no-color -input=false -auto-approve \
          --var-file='./variables/${{ inputs.environment }}.tfvars' \
          -var db_password=$db_password
