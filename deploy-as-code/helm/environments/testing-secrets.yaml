# Testing environment secrets — PLAINTEXT, NOT encrypted.
# Structure mirrors unified-demo-studio-secrets.yaml (decrypted form).
# Replace placeholder values with real credentials for actual deployments.
# DO NOT commit real credentials here — use SOPS encryption for cloud envs.

cluster-configs:
  secrets:
    db:
      username: "postgres"
      password: "postgres"
      flywayUsername: "postgres"
      flywayPassword: "postgres"

    egov-notification-sms:
      username: "test-sms-user"
      password: "test-sms-password"

    egov-pg-service:
      axis-merchant-id: "test-merchant-id"
      axis-merchant-secret-key: "test-merchant-secret"
      axis-merchant-user: "test-merchant-user"
      axis-merchant-pwd: "test-merchant-pwd"
      axis-merchant-access-code: "test-access-code"
      payu-merchant-key: "test-payu-key"
      payu-merchant-salt: "test-payu-salt"

    egov-notification-mail:
      mailsenderusername: "test@example.com"
      mailsenderpassword: "test-mail-password"

    egov-si-microservice:
      si-microservice-user: "test-si-user"
      si-microservice-password: "test-si-password"
      mail-sender-password: "test-mail-password"

    elasticsearch-master-creds:
      username: "elastic"
      password: "elastic_local"

    git-sync:
      ssh-private-key: ""

# Backbone-level secrets used by backboneservices-helmfile.yaml set: blocks via env vars.
# These are also available as .Values.secrets.* in chart templates that read from values.
secrets:
  db:
    username: "postgres"
    password: "postgres"
    flywayUsername: "postgres"
    flywayPassword: "postgres"

  elasticsearch:
    password: "elastic_local"

  kafka:
    # 22-char base64url cluster ID. Generate: cat /proc/sys/kernel/random/uuid | tr -d '-' | base64 | cut -c1-22
    clusterID: "bXlsb2NhbGNsdXN0ZXJpZDAx"

  minio:
    accessKey: "minio_access_key"
    secretKey: "minio_secret_key_123"

