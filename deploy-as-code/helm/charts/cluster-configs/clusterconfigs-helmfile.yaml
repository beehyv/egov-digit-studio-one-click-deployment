templates:
  default: &default
    version: 0.1.0
    namespace: egov
    # Valid values for missingFileHandler: "Error", "Warn", "Info", "Debug". Default is "Error".
    missingFileHandler: Warn
    values:
      - ../../environments/{{ requiredEnv "HELMFILE_ENV" }}-secrets.yaml
      - ../../environments/{{ requiredEnv "HELMFILE_ENV" }}.yaml

releases:
  - name: cluster-configs
    chart: .
    installed: true
    <<: *default
