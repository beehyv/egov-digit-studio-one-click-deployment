{{- if eq .Values.global.setup "quickstart" }} 
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    type: local
spec: 
  # Static binding (quickstart): avoid dynamic provisioning / StorageClass dependency.
  storageClassName: ""
  volumeName: pv-postgres
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
{{- end }}