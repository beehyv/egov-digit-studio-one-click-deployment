# environments block loads env values so .Values.* is available for inline Go templates
# (e.g. prometheus config, grafana secrets, global.domain)
# Paths are relative to this file's directory (charts/monitoring/).
environments:
  default:
    values:
      - ../../environments/{{ requiredEnv "HELMFILE_ENV" }}-secrets.yaml
      - ../../environments/{{ requiredEnv "HELMFILE_ENV" }}.yaml
---

repositories:
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: jaegertracing
    url: https://jaegertracing.github.io/helm-charts
  - name: kafka-ui
    url: https://provectus.github.io/kafka-ui-charts

# Note: releases are written without <<: *default anchor merges to avoid duplicate-key
# issues in strict YAML parsing of multi-document files. Each release is fully explicit.

releases:
  - name: loki-stack
    chart: grafana/loki-stack
    version: 2.10.1
    installed: true
    namespace: monitoring
    missingFileHandler: Warn
    values:
      - ../../environments/{{ requiredEnv "HELMFILE_ENV" }}-secrets.yaml
      - ../../environments/{{ requiredEnv "HELMFILE_ENV" }}.yaml
      - ./values/loki-stack.yaml

  - name: kube-prometheus-stack
    chart: prometheus-community/kube-prometheus-stack
    version: 56.6.2
    installed: true
    namespace: monitoring
    missingFileHandler: Warn
    disableValidation: true
    values:
      - ../../environments/{{ requiredEnv "HELMFILE_ENV" }}-secrets.yaml
      - ../../environments/{{ requiredEnv "HELMFILE_ENV" }}.yaml
      - ./values/prometheus.yaml
      - alertmanager:
          enabled: {{ .Values.prometheus.alertmanager.enabled }}
          config: {{ index .Values "cluster-configs" "secrets" "alertmanager" "config" | toYaml | nindent 10 }}
      - prometheus:
          prometheusSpec:
            additionalScrapeConfigs: {{ .Values.prometheus.additionalScrapeConfigs | toYaml | nindent 12 }}
            externalLabels: {{ .Values.prometheus.externalLabels | toYaml | nindent 12 }}
            storageSpec: {{ .Values.prometheus.storageSpec | toYaml | nindent 12 }}
            retention: {{ .Values.prometheus.retention | toYaml | nindent 12 }}

  - name: grafana
    chart: grafana/grafana
    version: 7.3.0
    installed: true
    namespace: monitoring
    missingFileHandler: Warn
    values:
      - ../../environments/{{ requiredEnv "HELMFILE_ENV" }}-secrets.yaml
      - ../../environments/{{ requiredEnv "HELMFILE_ENV" }}.yaml
      - ./values/grafana.yaml
      - grafana.ini:
          auth.github:
            allowed_organizations: {{ .Values.grafana.github.allowed_organizations }}
            role_attribute_path: {{ .Values.grafana.github.role_attribute_path }}
      - envRenderSecret:
          GF_AUTH_GITHUB_CLIENT_ID: {{ index .Values "cluster-configs" "secrets" "grafana" "clientID" }}
          GF_AUTH_GITHUB_CLIENT_SECRET: {{ index .Values "cluster-configs" "secrets" "grafana" "clientSecret" }}
    set:
      - name: ingress.hosts[0]
        value: {{ .Values.global.domain | quote }}
      - name: ingress.tls[0].hosts[0]
        value: {{ .Values.global.domain | quote }}

  - name: blackbox
    chart: prometheus-community/prometheus-blackbox-exporter
    version: 8.2.0
    installed: true
    namespace: monitoring
    missingFileHandler: Warn
    values:
      - ../../environments/{{ requiredEnv "HELMFILE_ENV" }}-secrets.yaml
      - ../../environments/{{ requiredEnv "HELMFILE_ENV" }}.yaml
      - ./values/blackbox-exporter.yaml
