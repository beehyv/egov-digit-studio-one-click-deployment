configmaps:
  egov-config:
    name: egov-config
    namespace: core
    data:
      db-host: "postgresql.backbone:5432"
      db-name: "postgres" ## Add db-name
      db-url: "jdbc:postgresql://postgresql.backbone:5432/postgres"
      db-otel-url: "jdbc:otel:postgresql://selco-prod-db.c1yks4g2c2zp.ap-south-1.rds.amazonaws.com/selcodevdb"
      domain: "digit-lts.digit.org" ## Add your Domain Name
      egov-bnd-freedownload-tenants: pg.testing
      egov-bnd-live-citizen-tenants: pg.testing
      egov-internal-microservice-user-uuid: 606192d1-4c90-42d9-878f-2294bc7ab9a9
      egov-services-fqdn-name: "https://digit-lts.digit.org/"
      egov-state-level-tenant-id: "pg"
      es-host: "elasticsearch-data.backbone"
      es-indexer-host: "https://elasticsearch-data.backbone:9200/"
      flyway-locations: "filesystem:/flyway/sql,filesystem:/flyway/seed,filesystem:/flyway/qa,classpath:/db/migration/main"
      kafka-brokers: "kafka-kraft-controller-headless.backbone:9092"
      kafka-infra-brokers: kafka-v2-infra.kafka-cluster:9092
      logging-level-jdbc: "DEBUG"
      mobile-validation-workaround: "true"
      serializers-timezone-in-ist: "true"
      server-tomcat-max-connections: "500"
      server-tomcat-max-threads: "10"
      sms-enabled: "true"
      spring-datasource-tomcat-initialSize: "1"
      spring-datasource-tomcat-max-active: "2"
      spring-jpa-show-sql: "true"
      timezone: Asia/Kolkata
      tracer-errors-provideexceptionindetails: "true"
      egov-bnd-freedownload-tenants: "pg.testing"
      egov-bnd-live-citizen-tenants: "pg.testing"
