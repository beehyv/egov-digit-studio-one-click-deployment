  dbUrl: "studio-one-click-db.czvokiourya9.ap-south-1.rds.amazonaws.com" ### replace DB URL
  dbReadUrl: "studio-one-click-db.czvokiourya9.ap-south-1.rds.amazonaws.com" ### replace DB URL
  environment: "one-clickdemo"
