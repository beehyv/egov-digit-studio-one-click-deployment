digit-studio:
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://egov-uat-assets.s3.ap-south-1.amazonaws.com/globalConfigsStudio.js type=text/javascript></script>
      ';"

ingress-nginx:
  domain: studio-one-click.digit.org # {{ .Values.global.domain }} moved from helmfile
  default-backend-service: "egov/nginx"
  namespace: egov
  cert-issuer: "letsencrypt-prod"
  ssl-protocols: "TLSv1.2 TLSv1.3"
  ssl-ciphers: "EECDH+CHACHA20:EECDH+AES"
  ssl-ecdh-curve: "X25519:prime256v1:secp521r1:secp384r1"
  controller:
    replicas: 1
    metrics:
      enabled: false
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
    addHeaders:
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "SAMEORIGIN"
      X-XSS-Protection: "1; mode=block"
      Access-Control-Allow-Origin: "https://urban-lts.digit.org"
      Access-Control-Allow-Methods: "GET, POST, OPTIONS"
      Access-Control-Allow-Headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range"
    setSslTls: "urban-lts.digit.org-tls-certs"
  # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<


