repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: jupyterhub
    url: https://hub.jupyter.org/helm-chart/


templates:
  default: &default
    namespace: backbone
    missingFileHandler: Warn
values:
  - namespace: backbone
  - ../environments/{{ requiredEnv "HELMFILE_ENV" }}-secrets.yaml
  - ../environments/{{ requiredEnv "HELMFILE_ENV" }}.yaml

releases:
- name: cert-manager
  chart: ./cert-manager
  namespace: core
  installed: true
  version: v1.16.2
  disableValidation: true
  values:
    - ./cert-manager/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: minio
  installed: true
  chart: ./minio
  version: 13.3.1
  <<: *default
  values:
    - ./minio/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - auth:
        rootUser: {{ .Values.secrets.minio.username }}
        rootPassword: {{ .Values.secrets.minio.password }}

#- name: postgresql
#  installed: false
#  chart: ./postgresql
#  version: 11.9.13
#  <<: *default
#  values:
#    - ./postgresql/values.yaml
#    - global:
#        postgresql:
#          auth:
#            postgresPassword: {{ .Values.secrets.db.password | quote }}

- name: redis
  installed: true
  chart: ./redis
  version: 7.2.4
  <<: *default
  values:
    - ./redis/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: elasticsearch
  chart: ./elasticsearch
  version: 8.11.3
  <<: *default
  values:
    - ./elasticsearch/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - secret:
        password: {{ .Values.secrets.elasticsearch.password }}

- name: elasticsearch-data
  chart: ./elasticsearch-data
  version: 8.11.3
  <<: *default
  values:
    - ./elasticsearch-data/values.yaml
    - {{ .Values | toYaml | nindent 8 }}

- name: kibana
  chart: ./kibana
  version: 8.11.3
  force: true
  <<: *default
  values:
    - ./kibana/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - ingress:
        hosts:
          - host: {{ .Values.global.domain }}
            paths:
              - path: /kibana
        tls: 
          - secretName: {{ .Values.global.domain }}-tls-certs
            hosts:
              - {{ .Values.global.domain }}

- name: kafka-kraft
  installed: true
  chart: ./kafka-kraft
  version: 26.2.0
  <<: *default
  values:
    - ./kafka-kraft/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
  set:
    - name: kraft.clusterId
      value: {{ .Values.secrets.kafka.clusterID }}

- name: ingress-nginx
  installed: true
  chart: ./ingress-nginx
  version: 4.10.0
  <<: *default
  values:
    - ./ingress-nginx/values.yaml
    - {{ .Values | toYaml | nindent 8 }}
    - domain: {{ .Values.global.domain }}

- name: playground
  installed: true
  chart: ./playground
  version: 0.1.0
  <<: *default
  values:
    - ./playground/values.yaml

